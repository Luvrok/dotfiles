# Port 443 is shared: nginx reads the SNI and picks either the local TLS
# termination (127.0.0.1:8443) or the xray tunnel. Unknown names go to xray.
#
# Included into the stream{} block by hosts/mos-eisley/nginx.nix
# (services.nginx.streamConfig).

map $ssl_preread_server_name $upstream {
    vxrnt.ru               web;
    www.vxrnt.ru           web;
    navidrome.vxrnt.ru     web;
    kavita.vxrnt.ru        web;
    qbt.vxrnt.ru           web;
    anki.vxrnt.ru          web;
    koito.vxrnt.ru         web;
    lt.vxrnt.ru            web;
    betanin.vxrnt.ru       web;
    metube.vxrnt.ru        web;
    obsidian.vxrnt.ru      web;
    rss.vxrnt.ru           web;
    default                xray;
}

upstream web  { server 127.0.0.1:8443; }
upstream xray { server 127.0.0.1:10443; }

server {
    listen 0.0.0.0:443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $upstream;
}

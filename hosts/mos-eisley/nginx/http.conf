# vxrnt.ru sites on mos-eisley.
#
# Included into the http{} block by hosts/mos-eisley/nginx.nix
# (services.nginx.appendHttpConfig).
#
# TLS is terminated here on 127.0.0.1:8443. Port 443 is a stream proxy
# (nginx/stream.conf) that reads the SNI and sends anything it does not
# know to the xray tunnel. Certificates are issued by ACME (see nginx.nix)
# into /var/lib/acme/<name>/; the http-01 challenges are answered by the
# :80 servers below.

# anki
server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name anki.vxrnt.ru;

    location / {
        return 301 https://$host$request_uri;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme/acme-challenge;
        auth_basic off;
        auth_request off;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name anki.vxrnt.ru;

    http2 on;
    ssl_certificate /var/lib/acme/anki.vxrnt.ru/fullchain.pem;
    ssl_certificate_key /var/lib/acme/anki.vxrnt.ru/key.pem;
    ssl_trusted_certificate /var/lib/acme/anki.vxrnt.ru/chain.pem;

    # recommended proxy settings (services.nginx.recommendedProxySettings)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $hostname;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme/acme-challenge;
        auth_basic off;
        auth_request off;
    }

    location / {
        proxy_pass http://127.0.0.1:8130;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
    }
}


    # recommended proxy settings (services.nginx.recommendedProxySettings)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $hostname;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme/acme-challenge;
        auth_basic off;
        auth_request off;
    }

    location / {
        proxy_pass http://127.0.0.1:5389;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
    }

    location /subtitle-translator/ {
        proxy_pass http://127.0.0.1:5390;
        client_max_body_size 20m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /rules {
        proxy_pass http://127.0.0.1:8291;
    }

    location = /subtitle-translator {
        return 301 /subtitle-translator/;
    }

    location = /sync {
        proxy_pass http://127.0.0.1:8291;
    }
}


keys:
  - &barnard  age18uengv7au9we7sh6j73y5u7yayucxdg5r62nk8trlgw2ycpkh58sphmrrz
  - &jedha    age1ylmhdnj5gp49p7403hjchxkyc8607snhmk8pdx76znyqk26htpeq2jma56
  # kessel: derived from /etc/ssh/ssh_host_ed25519_key (ssh-to-age), the
  # host key that already exists on the vps, no separate key file
  - &kessel   age1wd64fju9x2gspe5shqtu7nyl9yh5cawns0l5txtjr2lde0ztacts4aqar8
  - &mos-eisley age1e8gcp4eux9sfydkq9a8l7gm2qda7npg6e4e8yl8n9gjldk706cjsyqqt3v

creation_rules:
  - path_regex: secrets/(barnard|jedha)\.yaml$
    key_groups:
      - age:
          - *barnard
          - *jedha

  # barnard's downloads (Luvrok/kodi)
  - path_regex: secrets/arr\.yaml$
    key_groups:
      - age:
          - *barnard

  - path_regex: secrets/kessel\.yaml$
    key_groups:
      - age:
          - *barnard
          - *kessel

  - path_regex: secrets/mos-eisley\.yaml$
    key_groups:
      - age:
          - *barnard
          - *mos-eisley

  # opencode's api keys (modules/nixos/opencode-keys.nix)
  - path_regex: secrets/opencode\.json$
    key_groups:
      - age:
          - *barnard

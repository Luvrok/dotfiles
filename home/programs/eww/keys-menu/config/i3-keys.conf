# include this from i3 config:
# include ~/.config/eww/keys-menu/i3-keys.conf

# open the cheat sheet, the script enters the mode
bindsym $mod+slash exec --no-startup-id keys-menu toggle

# the script leaves the mode by itself: esc, any other key, any click.
# keep these in sync with menu_keys in keys-menu
mode "keys" {
  bindsym h exec --no-startup-id keys-menu prev
  bindsym Left exec --no-startup-id keys-menu prev
  bindsym l exec --no-startup-id keys-menu next
  bindsym Right exec --no-startup-id keys-menu next
  bindsym Tab exec --no-startup-id keys-menu next
  bindsym Escape exec --no-startup-id keys-menu close
  bindsym q exec --no-startup-id keys-menu close
}

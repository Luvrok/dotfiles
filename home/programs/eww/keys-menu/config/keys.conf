# keys-menu pages, $mod+/ shows them
#
#   [name]           a page. it opens first when the focused window's class
#                    is the name. more classes after it: [telegram telegramdesktop]
#   name:            a section
#   keys    what     a row: keys, 2+ spaces, then what it does
#
# keys: + joins a combo, " / " puts alternatives in one row (mod+j / k).
# mod shift ctrl alt get the dim keycap, the rest is written as is.
# the first page is the default one

[i3]

windows:
  mod+mmb / mod+shift+space    float / tile
  mod+;                        focus tiling / floating
  mod+shift+b                  toggle bar
  mod+y                        fullscreen
  mod+shift+c                  close
  mod+f                        center
  mod+s                        sticky

apps:
  mod+p                        app menu
  mod+c                        clipboard
  mod+shift+t                  terminal
  mod+shift+f                  librewolf
  mod+w                        power menu
  mod+b                        bluetooth
  mod+ctrl+w                   wi-fi
  mod+shift+w                  webcam
  mod+r / mod+shift+r          record / stop
  mod+u                        passwords
  mod+ctrl+k                   kill a process
  mod+shift+u                  nixos menu
  mod+shift+d                  audio
  mod+shift+y                  translate
  mod+o                        movies
  mod+prt                      ocr

media:
  mute / vol- / vol+           volume
  bri+ / bri-                  brightness
  prt                          screenshot

monitors:
  mod+f7 / mod+shift+f7        second monitor on / off
  mod+, / .                    focus left / right
  mod+shift+, / .              send window, follow
  mod+ctrl+, / .               send window

scratchpads:
  mod+g                        terminal
  mod+v                        dotfiles
  mod+e                        files
  mod+ctrl+g                   window to scratchpad
  mod+shift+g                  scratchpad to tile
  mod+ctrl+h / s               hide / show all

layout:
  mod+j / k                    focus next / prev
  mod+shift+j / k              move next / prev
  mod+h / l                    width - / +
  mod+alt+h / l                height + / -
  mod+i / d                    split side / below
  mod+t / m                    tile / monocle

tags:
  mod+1-9                      view
  mod+shift+1-9                move window
  mod+alt+1-9                  move window, follow
  mod+tab                      previous tag

system:
  mod+/                        this menu
  mod+f5                       reload xresources
  mod+ctrl+shift+q             restart i3
  mod+shift+bksp               exit i3

[kodi]

global:
  1 / 2 / 3                    home / movies / tv
  4                            tv channels
  5                            tmdb helper
  6                            downloads
  /                            search

person page:
  r                            reload tab
  i                            item info (players)
  c                            context menu
  b                            full biography

downloads:
  r                            refresh now
  v                            toggle selection
  d                            delete selected (confirm)
  space / p                    pause / resume
  right / left                 focus button / back
  enter                        context menu

[librewolf]

# browser defaults minus what customKeys.json turns off
tabs:
  ctrl+t                       new tab
  alt+n                        close tab
  ctrl+shift+t                 reopen closed tab
  ctrl+pgdn / pgup             next / prev tab
  ctrl+shift+pgdn / pgup       move tab right / left
  ctrl+n                       new window
  ctrl+shift+p                 private window

page:
  ctrl+l                       address bar
  ctrl+k                       search
  ctrl+f                       find
  ctrl+r / ctrl+shift+r        reload / skip cache
  ctrl+= / - / 0               zoom in / out / reset
  f11                          fullscreen
  ctrl+z / ctrl+y              undo / redo

tools:
  ctrl+h                       history
  ctrl+shift+y                 downloads
  ctrl+shift+a                 add-ons
  ctrl+shift+i                 devtools

# vimium defaults, change to yours
vimium:
  j / k                        scroll down / up
  d / u                        half page down / up
  gg / G                       top / bottom
  f / F                        open link / in new tab
  H / L                        back / forward
  J / K                        prev / next tab
  x / X                        close / restore tab
  o / O                        open url / in new tab
  T                            search tabs
  yy                           copy url
  /                            find
  gi                           first input

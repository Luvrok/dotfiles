# include this from i3 config:
# include ~/.config/eww/wifi-menu/i3-wifi.conf

# open menu and grab keys
bindsym $mod+Ctrl+w exec --no-startup-id wifi-menu open, mode "wifi"

mode "wifi" {
  bindsym j exec --no-startup-id wifi-menu down
  bindsym Down exec --no-startup-id wifi-menu down
  bindsym k exec --no-startup-id wifi-menu up
  bindsym Up exec --no-startup-id wifi-menu up
  bindsym g exec --no-startup-id wifi-menu top
  bindsym Shift+g exec --no-startup-id wifi-menu bottom
  bindsym r exec --no-startup-id wifi-menu rescan
  # script leaves the mode by itself
  bindsym Return exec --no-startup-id wifi-menu select
  bindsym Escape exec --no-startup-id wifi-menu close, mode "default"
  bindsym q exec --no-startup-id wifi-menu close, mode "default"
}

# only esc is bound, everything else goes to the password input
mode "wifi-pass" {
  bindsym Escape exec --no-startup-id wifi-menu cancel, mode "default"
}

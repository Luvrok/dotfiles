# the visualizer's cava (Media.qml): 24 bars from pipewire as numbers,
# a line a frame
[general]
bars = 24
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

# the keys menu's pages ($mod+/, menus/Keys.qml), the same format as the
# eww one in i3 (home/programs/eww/keys-menu/config/keys.conf)
#
#   [name]           a page. it opens first when the focused window's class
#                    is the name. more classes after it, ~word matches a part
#                    of the title: [nvim spdotfiles ~nvim]
#   name:            a section
#   keys    what     a row: keys, 2+ spaces, then what it does
#
# keys: + joins a combo, " / " puts alternatives in one row (mod+j / k).
# mod shift ctrl alt leader get the dim keycap, the rest is written as is.
# the first page is the default one. keep it in sync with hyprland.lua

[hyprland]

menus:
  mod+p                    run
  mod+c                    clipboard
  mod+u                    passwords
  mod+x                    windows
  mod+a                    tools
  mod+n                    notifications
  mod+shift+n              close the popup
  mod+w                    power
  mod+b                    bluetooth
  mod+ctrl+w               wi-fi
  mod+shift+d              audio
  mod+esc                  system
  mod+shift+esc            processes
  mod+ctrl+k               kill an app
  mod+ctrl+c               calendar
  mod+shift+u              nixos
  mod+shift+f              librewolf profile
  mod+r / mod+shift+r      record / stop
  mod+/                    this menu

tools (mod+a):
  e / c                    emoji / calc
  p / o                    color / ocr
  t / m                    translate / player
  u / v                    systemd / switches
  s                        screenshot

apps and media:
  mod+shift+t              terminal
  mod+shift+w              webcam
  mod+o                    movies
  mod+shift+o              kodi
  prt / mod+prt            screenshot / ocr
  mute / vol- / vol+       volume
  micmute                  mic
  bri- / bri+              brightness

windows:
  mod+shift+c              close
  mod+y                    fullscreen
  mod+shift+y              real fullscreen
  mod+mmb                  float / tile
  mod+lmb / rmb            drag / resize
  mod+;                    focus tiling / floating
  mod+f                    center
  mod+s                    pin
  mod+shift+p              pip to the other monitor
  mod+shift+b              toggle bar

layout:
  mod+j / k                focus next / prev
  mod+back / fwd           focus next / prev
  mod+shift+j / k          move next / prev
  mod+h / l                master - / +
  mod+shift+h / l          float taller / shorter
  mod+i / d                masters + / -
  mod+t / m                tile / monocle

tags:
  mod+1-9                  view
  mod+shift+1-9            move window
  mod+alt+1-9              move window, follow
  mod+tab                  previous tag
  mod+wheel                tags with windows
  mod+space                keyboard layout

scratchpads:
  mod+g                    terminal
  mod+v                    dotfiles
  mod+e                    files
  mod+ctrl+u               nix builds
  mod+ctrl+g               window to scratchpad
  mod+shift+g              scratchpad to tile
  mod+ctrl+h / s           hide / show all

monitors:
  mod+, / .                focus left / right
  mod+shift+, / .          send window, follow
  mod+ctrl+, / .           send window
  mod+f7 / mod+shift+f7    both / main at 240 Hz

session:
  mod+f5                   reload
  mod+shift+bksp           exit

[librewolf firefox]

# browser defaults minus what customKeys.json turns off
tabs:
  ctrl+t                   new tab
  alt+n                    close tab
  ctrl+shift+t             reopen closed tab
  ctrl+tab / pgdn          next tab
  ctrl+shift+tab / pgup    prev tab
  ctrl+shift+pgdn / pgup   move tab right / left
  ctrl+,                   search tabs
  ctrl+n                   new window
  ctrl+shift+p             private window

# sidebery's own, set in its settings
sidebery:
  ctrl+alt+left / right    prev / next tab
  ctrl+alt+1 / 2           prev / next panel
  ctrl+alt+x               close tab

page:
  ctrl+l                   address bar
  ctrl+k                   search
  ctrl+f                   find
  ctrl+r / ctrl+shift+r    reload / skip cache
  ctrl+= / - / 0           zoom in / out / reset
  f11                      fullscreen
  alt+p                    picture-in-picture
  ctrl+z / ctrl+y          undo / redo

tools:
  ctrl+h                   history
  ctrl+shift+y             downloads
  ctrl+shift+a             add-ons
  ctrl+shift+i             devtools

vimium:
  j / k                    scroll down / up
  d / u                    half page down / up
  gg / G                   top / bottom
  f / F                    open link / in new tab
  H / L                    back / forward
  J / K                    prev / next tab
  x / X                    close / restore tab
  o / O                    open url / in new tab
  T                        search tabs
  r                        reload
  yy / yf                  copy url / link
  p / P                    open clipboard / in new tab
  /                        find
  gi                       first input
  ?                        all vimium keys

[nvim spdotfiles ~nvim]

# leader is space
files:
  ctrl+p                   find file
  leader+p                 grep
  ctrl+f                   find in file
  leader+b                 buffers, d closes
  leader+o                 projects
  ctrl+n                   file tree
  leader+r                 yazi, ctrl+e cd there
  leader+lg                lazygit
  ctrl+\                   terminal
  q                        quit all

edit:
  ctrl+s                   save
  ctrl+z / ctrl+y          undo / redo
  ctrl+c / x / v           copy / cut / paste
  ctrl+a                   select all
  ctrl+/                   comment
  > / <                    indent, keeps selection
  ctrl+bksp                delete word
  leader+fm                format
  esc                      clear highlight

windows and buffers:
  ctrl+h / j / k / l       focus window
  ctrl+t                   new tab
  ctrl+w                   close buffer
  alt+left / right         prev / next buffer
  leader+?                 buffer keymaps

completion:
  tab / shift+tab          accept / snippet back
  ctrl+space               menu
  ctrl+n / p               next / prev
  ctrl+e                   hide
  ctrl+b / f               scroll docs
  ctrl+k                   signature

multicursor:
  alt+d                    add next match
  alt+s                    skip match
  alt+x                    remove cursor
  alt+j / k                cursor down / up

code:
  ]f / [f                  next / prev function
  ]c / [c                  next / prev class
  af / if                  a function / inside
  ac / ic                  a class / inside
  aa / ia                  a parameter / inside
  ab / ib                  a block / inside

# nvim's own lsp keys
lsp:
  K                        hover
  grn                      rename
  gra                      code action
  grr                      references
  gri                      implementation
  gO                       symbols
  ]d / [d                  next / prev diagnostic

[kodi]

# kodi's own keys and the vim ones (nixos/services/kodi/keyboard.xml)
move:
  h / j / k / l            left / down / up / right
  g                        first item
  ctrl+d / ctrl+u          page down / up
  shift+letter             jump to that letter

open:
  enter                    open / play in mpv
  c                        menu of the item
  i                        information, refresh, manual search
  q / backspace            back
  esc                      home
  /                        search (majan)

library:
  f                        update library

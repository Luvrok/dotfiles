# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# Docs: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml
#
# Один ID на модель. Сэмплинг в cmd — только дефолт, запрос его перекрывает:
# pi сам шлёт thinking и сэмплинг под уровень (home/programs/pi).
# :think / :no-think — для клиентов без переключателя thinking.
#
# VRAM: --fit у llama-server включён по умолчанию и оставляет 1 GiB
# свободным под Hyprland, а что не влезло, кладёт в RAM (слои плотной
# модели, эксперты MoE). С --fit off VRAM забивалась под край, и рабочий
# стол тормозил. --ctx-size каждой LLM повторён в home/programs/pi.

logLevel: info
logToStdout: both
healthCheckTimeout: 300
# выгрузка теряет prompt cache, и следующий ход pi заново читает весь контекст
globalTTL: 900
includeAliasesInList: true

macros:
  models: /var/lib/models
  llama: llama-server --port ${PORT} --threads 8
  # pi работает один: весь контекст одному слоту
  chat: ${llama} -np 1
  sd: sd-server --listen-ip 127.0.0.1 --listen-port ${PORT} --diffusion-fa
  # Qwen3.8 27B: KV есть только у 16 слоёв из 64, так что 128K в q4_0
  # (llama.cpp квантует его с вращением Адамара) стоят ~2.3 GiB.
  # MTP-голова лежит в GGUF, ngram-mod ускоряет повторы (правки кода,
  # который pi только что прочитал). Сэмплинг — режим thinking (Qwen).
  qwen-args: >
    ${chat}
    -fa on --cache-type-k q4_0 --cache-type-v q4_0
    --spec-type draft-mtp,ngram-mod --spec-draft-n-max 2
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0
  # abliterated квант RentedNoodle, шаблон froggeric для него обязателен.
  # temp 0.6 — с карточки, ради надёжных tool calls
  qwen-uc-args: >
    ${qwen-args}
    -m ${models}/qwen3.8-27b-UC/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-v1.1.gguf
    --chat-template-file ${models}/qwen3.8-27b-UC/froggeric-qwen3.8-tool-use.jinja
    --temp 0.6
  # CPU: embed не выгружается, на GPU он отнимал бы VRAM у LLM.
  # --gpu-layers 0 тут мало: GPU остаётся устройством модели, и llama.cpp
  # гонит на нём матмулы батчей с буфером ~1 GB. --device none — совсем
  # без GPU, mmproj у embed-vision тоже.
  # n_ubatch = min(n_batch, n_ubatch), а вход должен влезть в один ubatch
  embed-args: >
    ${llama}
    -m ${models}/embeddinggemma-2/embeddinggemma-2-BF16.gguf
    --embeddings --pooling mean --device none
    --ctx-size 8192 --batch-size 8192 --ubatch-size 8192

x-qwen-filters: &qwen-filters
  filters:
    setParamsByID:
      "${MODEL_ID}:no-think":
        temperature?: 0.7
        top_p?: 0.8
        presence_penalty?: 1.5
        chat_template_kwargs:
          enable_thinking: false

x-gemma-filters: &gemma-filters
  filters:
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs?:
          enable_thinking: false
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true

x-sd: &sd
  checkEndpoint: none
  ttl: 600

models:
  "qwen":
    description: "Qwen3.8 27B UD-IQ3_XXS, on GPU, 128K. Coding and agents."
    cmd: |
      ${qwen-args}
      -m ${models}/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --ctx-size 131072
    <<: *qwen-filters

  "qwen-uncensored":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated, on GPU, 128K."
    cmd: |
      ${qwen-uc-args}
      --ctx-size 131072
    <<: *qwen-filters

  # mmproj ~0.9 GB, --fit учитывает и его
  "qwen-uncensored-vision":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated with image input, 64K."
    cmd: |
      ${qwen-uc-args}
      --mmproj ${models}/qwen3.8-27b-UC/mmproj/mmproj-Qwen3.8-27B-BF16.gguf
      --ctx-size 65536
    <<: *qwen-filters

  # MoE, 4B active: эксперты, что не влезли, --fit отдаёт CPU почти без потери скорости
  "gemma-26b":
    description: "Gemma 4 26B-A4B QAT UD-Q4_K_XL. MoE, fast everyday model."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  # консолидирует память pi (settings.json: memory.consolidationModel)
  "gemma-12b":
    description: "Gemma 4 12B QAT UD-Q4_K_XL, on GPU. Fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  # thinking не выключается, reasoning_effort low/medium/high (по умолчанию medium)
  "gpt-oss":
    description: "gpt-oss-20b MXFP4. MoE, fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gpt-oss-20b-MXFP4.gguf
      --ctx-size 131072
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0

  # ---- Картинки: stable-diffusion.cpp (sd-server), /v1/images/generations ----
  # --cfg-scale, --steps и т.п. при старте становятся дефолтами запросов.

  # Turbo-дистиллят: cfg 1.0 и 8 шагов (с cfg 1.0 negative prompt не работает)
  "z-image":
    description: "Z-Image-Turbo Q8_0. Fast text-to-image, photorealism."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/z_image_turbo-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --vae ${models}/image/ae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --steps 8
    <<: *sd

  # генерация и правка по референсу (image в запросе). Дистиллят: cfg 1.0, 4 шага
  "flux2-klein":
    description: "FLUX.2-klein-4B Q8_0. Text-to-image and image editing."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/flux-2-klein-4b-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Q8_0.gguf
      --vae ${models}/image/flux2-vae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --sampling-method euler
      --steps 4
    <<: *sd

  # 20B, DiT 13.2 GB + энкодер на CPU, медленная. Родное разрешение 1328x1328
  "qwen-image":
    description: "Qwen-Image-2512 Q4_K_M. Best text rendering, slow."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/qwen-image-2512-Q4_K_M.gguf
      --llm ${models}/image/Qwen2.5-VL-7B-Instruct.Q4_K_M.gguf
      --vae ${models}/image/qwen_image_vae.safetensors
      --offload-to-cpu
      --clip-on-cpu
      --vae-conv-direct
      --cfg-scale 3.0
      --sampling-method euler
      --flow-shift 3
      --steps 30
    <<: *sd

  # sd.cpp сам подбирает flow-shift под разрешение. Стороны кратны 32
  "qwen-image-2.1":
    description: "Qwen-Image-2.1 Q4_K_M (unsloth). Text-to-image, text rendering, RGBA."
    cmd: |
      ${sd}
      --diffusion-model ${models}/qwen-image-2.1/qwen-image-2.1-Q4_K_M.gguf
      --llm ${models}/qwen-image-2.1/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --vae ${models}/qwen-image-2.1/qwen_image_2.1_vae_bf16.safetensors
      --cfg-scale 3.0
      --clip-on-cpu
      --sampling-method euler
      --steps 25
      -W 1024
      -H 1024
    <<: *sd

  # ---- Эмбеддинги (CPU), вектор 768 ----
  # pi-memory и docs-mcp. docs-mcp хранит имя модели в индексе и ходит по
  # алиасу: другая модель или квант = новый алиас здесь и в
  # nixos/services/docs-mcp, иначе старые и новые векторы смешаются.
  "embed":
    description: "EmbeddingGemma 2 BF16, CPU. pi-memory, docs-mcp."
    cmd: ${embed-args}
    aliases:
      - embeddinggemma-2-bf16
    ttl: 0

  # та же модель + энкодеры картинок/аудио/видео, векторы сравнимы с embed.
  # Медиа только через нативный /embeddings, /v1 пока только текст
  "embed-vision":
    description: "EmbeddingGemma 2 BF16 + mmproj, CPU. Image/audio/video embeddings."
    cmd: |
      ${embed-args}
      --mmproj ${models}/embeddinggemma-2/mmproj-BF16.gguf
    ttl: 600

hooks:
  on_startup:
    preload:
      - embed

routing:
  router:
    use: group
    settings:
      groups:
        # всё, что на GPU: одновременно живёт одна модель
        "main":
          swap: true
          exclusive: false
          members:
            - qwen
            - qwen-uncensored
            - qwen-uncensored-vision
            - gemma-26b
            - gemma-12b
            - gpt-oss
            - z-image
            - flux2-klein
            - qwen-image
            - qwen-image-2.1
        "embed":
          swap: false
          exclusive: false
          persistent: true
          members:
            - embed
            - embed-vision

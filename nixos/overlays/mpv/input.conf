# mpv keys. input-default-bindings=no: only what's here works.
#
# this file is also the cheat sheet (? in mpv) and the uosc menu (right
# click). "## Name" opens a sheet section, the comment after a binding is
# its row, the bang comment its menu entry. the format is explained at the
# top of scripts/keys.lua in mpv-config

## Playback

SPACE        cycle pause                                                  # play / pause
MBTN_LEFT    cycle pause; script-message-to uosc flash-pause-indicator   #@click # play / pause
TAB          script-message-to uosc toggle-ui                             #@press # show the ui while held
TAB          script-message-to uosc toggle-ui                             #@release
LEFT         seek -5;  script-binding uosc/flash-timeline                 # back 5 s
a            seek -5;  script-binding uosc/flash-timeline                 # back 5 s
RIGHT        seek 5;   script-binding uosc/flash-timeline                 # forward 5 s
d            seek 5;   script-binding uosc/flash-timeline                 # forward 5 s
DOWN         seek -60; script-binding uosc/flash-timeline                 # back 1 min
s            seek -60; script-binding uosc/flash-timeline                 # back 1 min
UP           seek 60;  script-binding uosc/flash-timeline                 # forward 1 min
w            seek 60;  script-binding uosc/flash-timeline                 # forward 1 min
PGUP         add chapter -1; script-binding uosc/flash-timeline           # previous chapter
PGDWN        add chapter 1;  script-binding uosc/flash-timeline           # next chapter
>            script-binding SmartSkip/smart-next                          # skip the intro (next chapter)
Ctrl+.       script-binding SmartSkip/toggle-autoskip                     # intro skip prompts on / off
,            frame-back-step                                              # previous frame
.            frame-step                                                   # next frame
[            add speed -0.1; script-binding uosc/flash-speed              # slower
]            add speed 0.1;  script-binding uosc/flash-speed              # faster
BS           set speed 1;    script-binding uosc/flash-speed              # normal speed

## Files

MBTN_RIGHT   script-binding uosc/menu-blurred                             # menu
ALT+a        script-message-to uosc show-submenu-blurred "File"           # file menu
o            script-binding uosc/open-file                                # open a file          #! File > Open
p            script-binding uosc/playlist                                 # playlist             #! File > Playlist
ENTER        playlist-next                                                # next file            #! File > Next
Shift+ENTER  playlist-prev                                                # previous file        #! File > Previous
h            script-binding memo-history                                  # history              #! File > History
#            script-binding uosc/chapters                                                        #! File > Chapters
#            script-binding uosc/show-in-directory                                               #! File > Show in folder
/            script-binding console/enable                                # console              #! File > Console
?            script-binding keys/toggle                                   # hotkeys              #! File > Hotkeys
F1           script-binding keys/toggle                                   # hotkeys
Ctrl+r       script-binding reload/reload_resume                          # reload, keep the position
Shift+w      write-watch-later-config                                     # remember the position
q            quit-watch-later                                             # quit, resume later

## Video

ALT+s        script-message-to uosc show-submenu-blurred "Video"          # video menu
f            cycle fullscreen                                             # fullscreen           #! Video > Fullscreen
g            cycle interpolation                                          # smooth motion        #! Video > Smooth motion
#            cycle deband                                                                        #! Video > Deband
Ctrl+d       script-binding autodeint/autodeint                           # deinterlace          #! Video > Deinterlace
e            screenshot                                                   # screenshot           #! Video > Screenshot
E            screenshot video                                             # screenshot, no subs  #! Video > Screenshot without subtitles
c            script-binding videoclip-menu-open                           # cut a clip           #! Video > Cut a clip
i            script-binding stats/display-stats                           # stats
I            script-binding stats/display-stats-toggle                    # stats, keep shown    #! Video > Stats
#            script-binding uosc/video                                                           #! Video > Tracks

## Audio

ALT+z        script-message-to uosc show-submenu-blurred "Audio"          # audio menu
WHEEL_UP     add volume 5;  script-binding uosc/flash-volume              # louder
0            add volume 5;  script-binding uosc/flash-volume              # louder
WHEEL_DOWN   add volume -5; script-binding uosc/flash-volume              # quieter
9            add volume -5; script-binding uosc/flash-volume              # quieter
m            cycle mute;    script-binding uosc/flash-volume              # mute                 #! Audio > Mute
A            script-binding uosc/audio                                    # pick a track         #! Audio > Tracks
#            script-binding uosc/audio-device                                                    #! Audio > Output

## Subtitles

ALT+x        script-message-to uosc show-submenu-blurred "Subtitles"      # subtitles menu
v            cycle sub-visibility                                         # show / hide          #! Subtitles > Show / hide
Y            script-binding uosc/subtitles                                # pick a track         #! Subtitles > Tracks
y            script-binding uosc/load-subtitles                           # load from a file     #! Subtitles > Load from a file
ALT+b        script-binding uosc/download-subtitles                       # download             #! Subtitles > Download
n            script-binding autosubsync-menu                              # sync to the audio    #! Subtitles > Sync to the audio
ALT+j        add sub-scale +0.05                                          # bigger               #! Subtitles > Bigger
ALT+k        add sub-scale -0.05                                          # smaller              #! Subtitles > Smaller
z            add sub-delay -0.1                                           # 0.1 s earlier        #! Subtitles > 0.1 s earlier
Z            add sub-delay 0.1                                            # 0.1 s later          #! Subtitles > 0.1 s later

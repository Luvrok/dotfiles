# Colors, fonts and font size come from theme.conf, generated from galaxy.theme.
include theme.conf

# Shell integration is sourced and configured manually (see default.nix)
shell_integration no-rc no-cursor

auto_reload_config -1
background_opacity 0.98
bell_on_tab no
clear_all_shortcuts yes
confirm_os_window_close 0
cursor_blink_interval 0.5
cursor_shape block
cursor_trail 1
cursor_trail_decay 0.45 0.45
enable_audio_bell no
symbol_map U+0025 JetBrains Mono
visual_bell_duration 0
window_padding_width 2.5

# todo: source http proxy

map ctrl+c copy_or_interrupt
map ctrl+q exit
map ctrl+shift+c copy_to_clipboard
map ctrl+v paste_from_clipboard

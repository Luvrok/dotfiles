# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# docs: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

logLevel: info
logToStdout: both
healthCheckTimeout: 300
# unloading drops the prompt cache, so pi's next turn reads the whole context again
globalTTL: 120
includeAliasesInList: true

# sampling in cmd is only a default, pi sends its own per thinking level
macros:
  models: /var/lib/models
  # the default --fit keeps 1 GiB vram free, --fit off filled it and the desktop lagged
  llama: llama-server --port ${PORT} --threads 8
  # pi is the only client, so one slot gets the whole context
  chat: ${llama} -np 1
  # the same on rocm (nixos/services/llama-swap/default.nix): qwen's mtp is
  # faster there
  chat-rocm: llama-server-rocm --port ${PORT} --threads 8 -np 1
  sd: sd-server --listen-ip 127.0.0.1 --listen-port ${PORT} --diffusion-fa
  # only 16 of 64 layers keep kv, so 128k in q4_0 is ~2.3 GiB. ngram-mod speeds up re-typed code
  qwen-args: >
    ${chat-rocm}
    -fa on --cache-type-k q4_0 --cache-type-v q4_0
    --spec-type draft-mtp,ngram-mod --spec-draft-n-max 2
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0
  # this quant needs the froggeric template, temp 0.6 is from its card for steady tool calls
  qwen-uc-args: >
    ${qwen-args}
    -m ${models}/qwen3.8-27b-UC/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-v1.1.gguf
    --chat-template-file ${models}/qwen3.8-27b-UC/froggeric-qwen3.8-tool-use.jinja
    --temp 0.6
  # --device none, since --gpu-layers 0 still runs batches on the gpu with a ~1 GB buffer
  embed-args: >
    ${llama}
    -m ${models}/embeddinggemma-2/embeddinggemma-2-BF16.gguf
    --embeddings --pooling mean --device none
    --ctx-size 8192 --batch-size 8192 --ubatch-size 8192

# :think and :no-think are for clients without a thinking switch
x-qwen-filters: &qwen-filters
  filters:
    setParamsByID:
      "${MODEL_ID}:no-think":
        temperature?: 0.7
        top_p?: 0.8
        presence_penalty?: 1.5
        chat_template_kwargs:
          enable_thinking: false

x-gemma-filters: &gemma-filters
  filters:
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs?:
          enable_thinking: false
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true

# sd-server flags like --cfg-scale and --steps are only request defaults
x-sd: &sd
  checkEndpoint: none
  ttl: 120

# each llm's --ctx-size is repeated as contextWindow in pi/models.json
models:
  "qwen":
    description: "Qwen3.8 27B UD-IQ3_XXS, on GPU, 128K. Coding and agents."
    cmd: |
      ${qwen-args}
      -m ${models}/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --ctx-size 131072
    <<: *qwen-filters

  "qwen-uncensored":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated, on GPU, 128K."
    cmd: |
      ${qwen-uc-args}
      --ctx-size 131072
    <<: *qwen-filters

  # --fit counts the ~0.9 GB mmproj too
  "qwen-uncensored-vision":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated with image input, 64K."
    cmd: |
      ${qwen-uc-args}
      --mmproj ${models}/qwen3.8-27b-UC/mmproj/mmproj-Qwen3.8-27B-BF16.gguf
      --ctx-size 65536
    <<: *qwen-filters

  # a 128k f16 kv cache made --fit push part of each gemma to the cpu: 56 t/s
  # for the 26b and the 12b alike (llama-bench, empty context: 129 for the
  # 26b). q8_0 halves it, gemma barely notices
  "gemma-26b":
    description: "Gemma 4 26B-A4B QAT UD-Q4_K_XL. MoE, fast everyday model."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  "gemma-12b":
    description: "Gemma 4 12B QAT UD-Q4_K_XL, on GPU. Fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  # the voice assistant (Luvrok/jarvis): gemma-12b with a short
  # context, loaded for 10 minutes after a question, so the next one is
  # instant. gemma 4's per-layer embeddings stay in ram, not vram, and the
  # default lazy mode reads only tensors over 4 GiB from disk: it kept ~7 GiB
  # of ram while it waited. --lazy-mode on reads their rows on demand.
  # --cache-ram 0: llama-server keeps up to 8 GiB of old prompts in ram by
  # default, and jarvis' prompt changes every minute (its clock), so that
  # cache only grew. the slot's own cache in vram still reuses the history
  "jarvis":
    description: "Gemma 4 12B QAT UD-Q4_K_XL, 8K. Jarvis, the voice assistant."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 8192
      --lazy-mode on
      --cache-ram 0
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    ttl: 600
    <<: *gemma-filters

  # thinking can't be turned off, only reasoning_effort low, medium or high
  "gpt-oss":
    description: "gpt-oss-20b MXFP4. MoE, fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gpt-oss-20b-MXFP4.gguf
      --ctx-size 131072
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0

  # turbo distill: cfg 1.0 and 8 steps, so a negative prompt does nothing
  "z-image":
    description: "Z-Image-Turbo Q8_0. Fast text-to-image, photorealism."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/z_image_turbo-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --vae ${models}/image/ae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --steps 8
    <<: *sd

  # also edits a reference image from the request, distill so cfg 1.0 and 4 steps
  "flux2-klein":
    description: "FLUX.2-klein-4B Q8_0. Text-to-image and image editing."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/flux-2-klein-4b-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Q8_0.gguf
      --vae ${models}/image/flux2-vae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --sampling-method euler
      --steps 4
    <<: *sd

  # 20b and slow, the encoder runs on the cpu. native size is 1328x1328
  "qwen-image":
    description: "Qwen-Image-2512 Q4_K_M. Best text rendering, slow."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/qwen-image-2512-Q4_K_M.gguf
      --llm ${models}/image/Qwen2.5-VL-7B-Instruct.Q4_K_M.gguf
      --vae ${models}/image/qwen_image_vae.safetensors
      --offload-to-cpu
      --clip-on-cpu
      --vae-conv-direct
      --cfg-scale 3.0
      --sampling-method euler
      --flow-shift 3
      --steps 30
    <<: *sd

  # sd.cpp picks flow-shift for the size itself, sides must be multiples of 32
  "qwen-image-2.1":
    description: "Qwen-Image-2.1 Q4_K_M (unsloth). Text-to-image, text rendering, RGBA."
    cmd: |
      ${sd}
      --diffusion-model ${models}/qwen-image-2.1/qwen-image-2.1-Q4_K_M.gguf
      --llm ${models}/qwen-image-2.1/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --vae ${models}/qwen-image-2.1/qwen_image_2.1_vae_bf16.safetensors
      --cfg-scale 3.0
      --clip-on-cpu
      --sampling-method euler
      --steps 25
      -W 1024
      -H 1024
    <<: *sd

  # jarvis' voices: qwen3-tts servers in podman (Luvrok/jarvis),
  # jarvis-tts starts their unit and lives while it runs. fixed ports, the
  # same as there. the server knows itself as qwen3-tts
  "jarvis-tts-base":
    description: "Qwen3-TTS 12Hz 1.7B Base, on GPU. Jarvis' cloned voices."
    cmd: jarvis-tts base
    cmdStop: systemctl stop jarvis-tts-base.service
    proxy: http://127.0.0.1:8881
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  # the 0.6b base: the cloned voices quicker than real time (jarvis clones
  # small), a bit less like the original
  "jarvis-tts-small":
    description: "Qwen3-TTS 12Hz 0.6B Base, on GPU. Jarvis' cloned voices, quicker."
    cmd: jarvis-tts small
    cmdStop: systemctl stop jarvis-tts-small.service
    proxy: http://127.0.0.1:8883
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  "jarvis-tts-kurisu":
    description: "Qwen3-TTS 12Hz 1.7B Makise Kurisu finetune, on GPU. Kurisu and Amadeus."
    cmd: jarvis-tts kurisu
    cmdStop: systemctl stop jarvis-tts-kurisu.service
    proxy: http://127.0.0.1:8882
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  # docs-mcp keys its index on the alias, so a new model or quant needs a new alias here and in docs-mcp
  "embed":
    description: "EmbeddingGemma 2 BF16, CPU. pi-memory, docs-mcp."
    cmd: ${embed-args}
    aliases:
      - embeddinggemma-2-bf16
    ttl: 0

  # vectors match embed, media works only on native /embeddings, /v1 is text only
  "embed-vision":
    description: "EmbeddingGemma 2 BF16 + mmproj, CPU. Image/audio/video embeddings."
    cmd: |
      ${embed-args}
      --mmproj ${models}/embeddinggemma-2/mmproj-BF16.gguf
    ttl: 120

hooks:
  on_startup:
    preload:
      - embed

routing:
  router:
    use: group
    settings:
      groups:
        # everything on the gpu, one model at a time
        "main":
          swap: true
          exclusive: false
          members:
            - qwen
            - qwen-uncensored
            - qwen-uncensored-vision
            - gemma-26b
            - gemma-12b
            - jarvis
            - gpt-oss
            - z-image
            - flux2-klein
            - qwen-image
            - qwen-image-2.1
        # one tts at a time, next to jarvis: loading one never unloads it
        "jarvis-tts":
          swap: true
          exclusive: false
          members:
            - jarvis-tts-base
            - jarvis-tts-small
            - jarvis-tts-kurisu
        "embed":
          swap: false
          exclusive: false
          persistent: true
          members:
            - embed
            - embed-vision

# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# docs: https://github.com/mostlygeek/llama-swap/blob/main/docs/config.example.yaml

logLevel: info
logToStdout: both
healthCheckTimeout: 300
# unloading drops the prompt cache, so pi's next turn reads the whole context again
globalTTL: 120
includeAliasesInList: true

# sampling in cmd is only a default, pi sends its own per thinking level
macros:
  models: /var/lib/models
  # the default --fit keeps 1 GiB vram free, --fit off filled it and the desktop lagged
  llama: llama-server --port ${PORT} --threads 8
  # pi is the only client, so one slot gets the whole context
  chat: ${llama} -np 1
  # the same on rocm (modules/nixos/llama-swap/default.nix): qwen's mtp is
  # faster there
  chat-rocm: llama-server-rocm --port ${PORT} --threads 8 -np 1
  sd: sd-server --listen-ip 127.0.0.1 --listen-port ${PORT} --diffusion-fa
  # only 16 of 64 layers keep kv, so 128k in q4_0 is ~2.3 GiB. ngram-mod speeds up re-typed code
  qwen-args: >
    ${chat-rocm}
    -fa on --cache-type-k q4_0 --cache-type-v q4_0
    --spec-type draft-mtp,ngram-mod --spec-draft-n-max 2
    --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0
  # this quant needs the froggeric template, temp 0.6 is from its card for steady tool calls
  qwen-uc-args: >
    ${qwen-args}
    -m ${models}/qwen3.8-27b-UC/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-v1.1.gguf
    --chat-template-file ${models}/qwen3.8-27b-UC/froggeric-qwen3.8-tool-use.jinja
    --temp 0.6
  # inkling2 has its own binary: nixpkgs' llama.cpp predates the looped arch
  # (modules/nixos/llama-swap/llama-cpp-inkling.nix). --jinja is not optional,
  # the template is what turns reasoning_effort into the thinking budget
  # inkling's compute buffer grows with -ub, and kv with the context: 128k of
  # f16 kv is 4 GiB, q4_0 is 1.2 and keeps all 49 layers on the gpu (the loop
  # reads kv three times, q8_0 costs another fit trim). ub 64 holds the
  # compute buffer at ~1.7 GiB; the default 512 asked for 6.6 at 64k and 13 at
  # 128k, which --fit answered by moving the model to the cpu
  inkling: llama-server-inkling --port ${PORT} --threads 8 -np 1
  inkling-args: >
    ${inkling}
    --jinja -fa on -ub 64 -ctk q4_0 -ctv q4_0
    --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0
  # the inkling coding variants keep whole expert layers in ram; n-cpu-moe
  # takes the first layers, and those sit outside the looped core (6-17), so
  # their experts are read once per token instead of three times. qwen-coding
  # fits at 64k without cpu layers (14415 of 15540 MiB), so it has none
  inkling-coding-args: >
    ${inkling-args}
    --n-cpu-moe 5
  inkling-uc-coding-args: >
    ${inkling-args}
    --n-cpu-moe 8
  # --device none, since --gpu-layers 0 still runs batches on the gpu with a ~1 GB buffer
  embed-args: >
    ${llama}
    -m ${models}/embeddinggemma-2/embeddinggemma-2-BF16.gguf
    --embeddings --pooling mean --device none
    --ctx-size 8192 --batch-size 8192 --ubatch-size 8192

# :think and :no-think are for clients without a thinking switch
x-qwen-filters: &qwen-filters
  filters:
    setParamsByID:
      "${MODEL_ID}:no-think":
        temperature?: 0.7
        top_p?: 0.8
        presence_penalty?: 1.5
        chat_template_kwargs:
          enable_thinking: false

# jarvis never thinks, whatever a request asks for: it only talks, and
# thinking would come before the first spoken word. --reasoning off in each
# jarvis cmd does it on the server, this for the requests
x-jarvis-filters: &jarvis-filters
  filters:
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs:
          enable_thinking: false

# inkling's template takes reasoning_effort (none, minimal, low, medium, high,
# xhigh). "none" is the bottom of the scale, not off: the vendor says it still
# reasons a little, and the template always writes the effort line
x-inkling-filters: &inkling-filters
  filters:
    setParamsByID:
      "${MODEL_ID}:no-think":
        chat_template_kwargs:
          reasoning_effort: "none"
      "${MODEL_ID}:think":
        chat_template_kwargs:
          reasoning_effort: "high"

x-gemma-filters: &gemma-filters
  filters:
    setParamsByID:
      "${MODEL_ID}":
        chat_template_kwargs?:
          enable_thinking: false
      "${MODEL_ID}:think":
        chat_template_kwargs:
          enable_thinking: true

# sd-server flags like --cfg-scale and --steps are only request defaults
x-sd: &sd
  checkEndpoint: none
  ttl: 120

# each llm's --ctx-size is repeated as contextWindow in modules/home/programs/pi/models.json
models:
  "qwen":
    description: "Qwen3.8 27B UD-IQ3_XXS, on GPU, 128K. Coding and agents."
    cmd: |
      ${qwen-args}
      -m ${models}/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --ctx-size 131072
    <<: *qwen-filters

  # Q3_K_XL now sits in the root, next to the other qwen quants
  "qwen-coding":
    description: "Qwen3.8 27B UD-Q3_K_XL, on GPU, 64K. Coding."
    cmd: |
      ${qwen-args}
      -m ${models}/Qwen3.8-27B-UD-Q3_K_XL.gguf
      --ctx-size 65536
    <<: *qwen-filters

  # the card claims 196k resident on 16 GB, but with the desktop taking ~1 GiB
  # 196k projects 15575 MiB against 15540 free and --fit moves 8 of 66 layers
  # to the cpu; 128k keeps all 66 with ~1.7 GiB left
  "qwen-uncensored":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated, on GPU, 128K."
    cmd: |
      ${qwen-uc-args}
      --ctx-size 131072
    <<: *qwen-filters

  # --fit counts the ~0.9 GB mmproj too
  "qwen-uncensored-vision":
    description: "Qwen3.8 27B GSQ-RCO IQ3_XXS abliterated with image input, 64K."
    cmd: |
      ${qwen-uc-args}
      --mmproj ${models}/qwen3.8-27b-UC/mmproj/mmproj-Qwen3.8-27B-BF16.gguf
      --ctx-size 65536
    <<: *qwen-filters

  # inkling 2 mini: 26.4B moe with 3.4B active and a 24-layer core whose
  # middle 12 layers run three times. 128k of q4_0 kv is 1.2 GiB (f16 would
  # be 4). the socket is the qwen card's: /var/lib/models/inkling-2-mini
  "inkling":
    description: "Inkling 2 Mini UD-IQ3_XXS, on GPU, 128K. 26B MoE."
    cmd: |
      ${inkling-args}
      -m ${models}/inkling-2-mini/Inkling-2-Mini-UD-IQ3_XXS.gguf
      --ctx-size 131072
    <<: *inkling-filters

  "inkling-coding":
    description: "Inkling 2 Mini UD-IQ4_XS, 5 expert layers on RAM, 128K."
    cmd: |
      ${inkling-coding-args}
      -m ${models}/inkling-2-mini/Inkling-2-Mini-UD-IQ4_XS.gguf
      --ctx-size 131072
    <<: *inkling-filters

  "inkling-uncensored":
    description: "Inkling 2 Mini AD-IQ3_S abliterated, on GPU, 128K."
    cmd: |
      ${inkling-args}
      -m ${models}/inkling-2-mini/Inkling-2-Mini-Uncensored-AD-IQ3_S.gguf
      --ctx-size 131072
    <<: *inkling-filters

  "inkling-uncensored-coding":
    description: "Inkling 2 Mini AD-Q4_K abliterated, 8 expert layers on RAM, 128K."
    cmd: |
      ${inkling-uc-coding-args}
      -m ${models}/inkling-2-mini/Inkling-2-Mini-Uncensored-AD-Q4_K.gguf
      --ctx-size 131072
    <<: *inkling-filters

  # a 128k f16 kv cache made --fit push part of each gemma to the cpu: 56 t/s
  # for the 26b and the 12b alike (llama-bench, empty context: 129 for the
  # 26b). q8_0 halves it, gemma barely notices
  "gemma-26b":
    description: "Gemma 4 26B-A4B QAT UD-Q4_K_XL. MoE, fast everyday model."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  "gemma-12b":
    description: "Gemma 4 12B QAT UD-Q4_K_XL, on GPU. Fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 131072
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    <<: *gemma-filters

  # the voice assistant (Luvrok/jarvis): gemma-12b with a short
  # context, loaded for 10 minutes after a question, so the next one is
  # instant. gemma 4's per-layer embeddings stay in ram, not vram, and the
  # default lazy mode reads only tensors over 4 GiB from disk: it kept ~7 GiB
  # of ram while it waited. --lazy-mode on reads their rows on demand.
  # --cache-ram 0: llama-server would keep up to 8 GiB of old prompts in ram,
  # the slot's own cache in vram is all jarvis needs: its prompt starts the
  # same every time (the time and the lore are in the last message), so a
  # question reads only its own tokens
  "jarvis":
    description: "Gemma 4 12B QAT UD-Q4_K_XL, 8K. Jarvis, the voice assistant."
    cmd: |
      ${chat}
      -m ${models}/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 8192
      --lazy-mode on
      --cache-ram 0
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
      --reasoning off
    ttl: 600
    <<: *jarvis-filters

  # jarvis on qwen3.5's small dense models, picked in its menu: quicker
  # than gemma-12b, to read the prompt and to answer. sampling from qwen's
  # card for no thinking. hf download unsloth/Qwen3.5-9B-GGUF --include
  # "*UD-Q4_K_XL*" --local-dir /var/lib/models, the same for 4B
  "jarvis-qwen-9b":
    description: "Qwen3.5 9B UD-Q4_K_XL, 8K. Jarvis, quicker."
    cmd: |
      ${chat}
      -m ${models}/Qwen3.5-9B-UD-Q4_K_XL.gguf
      --ctx-size 8192
      --cache-ram 0
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5
      --reasoning off
    ttl: 600
    <<: *jarvis-filters

  "jarvis-qwen-4b":
    description: "Qwen3.5 4B UD-Q4_K_XL, 8K. Jarvis, quickest."
    cmd: |
      ${chat}
      -m ${models}/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --ctx-size 8192
      --cache-ram 0
      -fa on --cache-type-k q8_0 --cache-type-v q8_0
      --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --presence-penalty 1.5
      --reasoning off
    ttl: 600
    <<: *jarvis-filters

  # thinking can't be turned off, only reasoning_effort low, medium or high
  "gpt-oss":
    description: "gpt-oss-20b MXFP4. MoE, fast, web search."
    cmd: |
      ${chat}
      -m ${models}/gpt-oss-20b-MXFP4.gguf
      --ctx-size 131072
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0

  # turbo distill: cfg 1.0 and 8 steps, so a negative prompt does nothing
  "z-image":
    description: "Z-Image-Turbo Q8_0. Fast text-to-image, photorealism."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/z_image_turbo-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --vae ${models}/image/ae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --steps 8
    <<: *sd

  # also edits a reference image from the request, distill so cfg 1.0 and 4 steps
  "flux2-klein":
    description: "FLUX.2-klein-4B Q8_0. Text-to-image and image editing."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/flux-2-klein-4b-Q8_0.gguf
      --llm ${models}/image/Qwen3-4B-Q8_0.gguf
      --vae ${models}/image/flux2-vae.safetensors
      --vae-conv-direct
      --cfg-scale 1.0
      --sampling-method euler
      --steps 4
    <<: *sd

  # 20b and slow, the encoder runs on the cpu. native size is 1328x1328
  "qwen-image":
    description: "Qwen-Image-2512 Q4_K_M. Best text rendering, slow."
    cmd: |
      ${sd}
      --diffusion-model ${models}/image/qwen-image-2512-Q4_K_M.gguf
      --llm ${models}/image/Qwen2.5-VL-7B-Instruct.Q4_K_M.gguf
      --vae ${models}/image/qwen_image_vae.safetensors
      --offload-to-cpu
      --clip-on-cpu
      --vae-conv-direct
      --cfg-scale 3.0
      --sampling-method euler
      --flow-shift 3
      --steps 30
    <<: *sd

  # sd.cpp picks flow-shift for the size itself, sides must be multiples of 32
  "qwen-image-2.1":
    description: "Qwen-Image-2.1 Q4_K_M (unsloth). Text-to-image, text rendering, RGBA."
    cmd: |
      ${sd}
      --diffusion-model ${models}/qwen-image-2.1/qwen-image-2.1-Q4_K_M.gguf
      --llm ${models}/qwen-image-2.1/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      --vae ${models}/qwen-image-2.1/qwen_image_2.1_vae_bf16.safetensors
      --cfg-scale 3.0
      --clip-on-cpu
      --sampling-method euler
      --steps 25
      -W 1024
      -H 1024
    <<: *sd

  # jarvis' voices: qwen3-tts servers in podman (Luvrok/jarvis),
  # jarvis-tts starts their unit and lives while it runs. fixed ports, the
  # same as there. the server knows itself as qwen3-tts
  "jarvis-tts-base":
    description: "Qwen3-TTS 12Hz 1.7B Base, on GPU. Jarvis' cloned voices."
    cmd: jarvis-tts base
    cmdStop: systemctl stop jarvis-tts-base.service
    proxy: http://127.0.0.1:8881
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  # the 0.6b base: the cloned voices quicker than real time (jarvis clones
  # small), a bit less like the original
  "jarvis-tts-small":
    description: "Qwen3-TTS 12Hz 0.6B Base, on GPU. Jarvis' cloned voices, quicker."
    cmd: jarvis-tts small
    cmdStop: systemctl stop jarvis-tts-small.service
    proxy: http://127.0.0.1:8883
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  "jarvis-tts-kurisu":
    description: "Qwen3-TTS 12Hz 1.7B Makise Kurisu finetune, on GPU. Kurisu and Amadeus."
    cmd: jarvis-tts kurisu
    cmdStop: systemctl stop jarvis-tts-kurisu.service
    proxy: http://127.0.0.1:8882
    checkEndpoint: /health
    useModelName: qwen3-tts
    ttl: 600

  # docs-mcp and notes-mcp key their index on the alias, so a new model or quant needs a new alias here and in both
  "embed":
    description: "EmbeddingGemma 2 BF16, CPU. pi-memory, docs-mcp, notes-mcp."
    cmd: ${embed-args}
    aliases:
      - embeddinggemma-2-bf16
    ttl: 0

  # vectors match embed, media works only on native /embeddings, /v1 is text only
  "embed-vision":
    description: "EmbeddingGemma 2 BF16 + mmproj, CPU. Image/audio/video embeddings."
    cmd: |
      ${embed-args}
      --mmproj ${models}/embeddinggemma-2/mmproj-BF16.gguf
    ttl: 120

hooks:
  on_startup:
    preload:
      - embed

routing:
  router:
    use: group
    settings:
      groups:
        # everything on the gpu, one model at a time
        "main":
          swap: true
          exclusive: false
          members:
            - qwen
            - qwen-coding
            - qwen-uncensored
            - qwen-uncensored-vision
            - inkling
            - inkling-coding
            - inkling-uncensored
            - inkling-uncensored-coding
            - gemma-26b
            - gemma-12b
            - jarvis
            - jarvis-qwen-9b
            - jarvis-qwen-4b
            - gpt-oss
            - z-image
            - flux2-klein
            - qwen-image
            - qwen-image-2.1
        # one tts at a time, next to jarvis: loading one never unloads it
        "jarvis-tts":
          swap: true
          exclusive: false
          members:
            - jarvis-tts-base
            - jarvis-tts-small
            - jarvis-tts-kurisu
        "embed":
          swap: false
          exclusive: false
          persistent: true
          members:
            - embed
            - embed-vision

# mpv keys, the vim way of nvim, vimium and yazi here: hjkl (and wasd and
# the arrows), gg, :, /, ctrl+o/i, ctrl+p, J/K, g-prefixed folders.
# input-default-bindings=no: only what's here works. scripts/layout.lua in
# mpv-config binds them all once more for the russian layout.
#
# this file is also the cheat sheet (? in mpv) and the uosc menu (ctrl+space,
# right click). "## Name" opens a sheet section, the comment after a binding
# is its row (the same text shares a row), the bang comment its menu entry,
# "#? keys  text" a row for keys bound elsewhere. scripts/keys.lua in
# mpv-config explains the format

## Playback

SPACE        cycle pause                                                  # play / pause
MBTN_LEFT    cycle pause; script-message-to uosc flash-pause-indicator   #@click # play / pause
TAB          script-message-to uosc toggle-ui                             #@press # show the ui while held
TAB          script-message-to uosc toggle-ui                             #@release
h            seek -5;  script-binding uosc/flash-timeline                 # back / forward 5 s
l            seek 5;   script-binding uosc/flash-timeline                 # back / forward 5 s
a            seek -5;  script-binding uosc/flash-timeline                 # back / forward 5 s
d            seek 5;   script-binding uosc/flash-timeline                 # back / forward 5 s
LEFT         seek -5;  script-binding uosc/flash-timeline                 # back / forward 5 s
RIGHT        seek 5;   script-binding uosc/flash-timeline                 # back / forward 5 s
j            seek -60; script-binding uosc/flash-timeline                 # back / forward 1 min
k            seek 60;  script-binding uosc/flash-timeline                 # back / forward 1 min
s            seek -60; script-binding uosc/flash-timeline                 # back / forward 1 min
w            seek 60;  script-binding uosc/flash-timeline                 # back / forward 1 min
DOWN         seek -60; script-binding uosc/flash-timeline                 # back / forward 1 min
UP           seek 60;  script-binding uosc/flash-timeline                 # back / forward 1 min
(            sub-seek -1; script-binding uosc/flash-timeline              # previous / next subtitle line
)            sub-seek 1;  script-binding uosc/flash-timeline              # previous / next subtitle line
g            ignore
g-g          seek 0 absolute; script-binding uosc/flash-timeline          # to the start
Ctrl+o       script-binding UndoRedo/undo                                 # jump back, undoes a seek
Ctrl+z       script-binding UndoRedo/undo                                 # jump back, undoes a seek
Ctrl+i       script-binding UndoRedo/redo                                 # jump forward again
Ctrl+y       script-binding UndoRedo/redo                                 # jump forward again
PGUP         add chapter -1; script-binding uosc/flash-timeline           # previous / next chapter
PGDWN        add chapter 1;  script-binding uosc/flash-timeline           # previous / next chapter
>            script-binding SmartSkip/smart-next                          # skip the intro (next chapter)
Ctrl+.       script-binding SmartSkip/toggle-autoskip                     # intro skip prompts on / off
,            frame-back-step                                              # previous / next frame
.            frame-step                                                   # previous / next frame
[            add speed -0.1; script-binding uosc/flash-speed              # slower / faster
]            add speed 0.1;  script-binding uosc/flash-speed              # slower / faster
BS           set speed 1;    script-binding uosc/flash-speed              # normal speed

## Files

Ctrl+SPACE   script-binding uosc/menu                                     # menu
MENU         script-binding uosc/menu                                     # menu
MBTN_RIGHT   script-binding uosc/menu-blurred                             # menu
ALT+a        script-message-to uosc show-submenu "File"                   # file menu
Ctrl+p       script-binding find/toggle                                   # find a file, fuzzy   #! File > Find a file
o            script-binding uosc/open-file                                # browse this folder   #! File > Browse this folder
Ctrl+n       script-binding uosc/open-file                                # browse this folder
g-l          script-message-to uosc open-file /media/outer-1              # library, outer-1     #! File > Library
g-h          script-message-to uosc open-file ~                           # home folder
g-d          script-message-to uosc open-file ~/downloads                 # downloads
g-v          script-message-to uosc open-file ~/documents/videos          # videos and clips
p            script-binding uosc/playlist                                 # playlist             #! File > Playlist
Ctrl+h       script-binding memo-history                                  # history              #! File > History
Alt+c        script-binding uosc/chapters                                 # chapters             #! File > Chapters
J            playlist-prev                                                # previous file        #! File > Previous
Alt+LEFT     playlist-prev                                                # previous file
Shift+ENTER  playlist-prev                                                # previous file
K            playlist-next                                                # next file            #! File > Next
Alt+RIGHT    playlist-next                                                # next file
ENTER        playlist-next                                                # next file
Ctrl+v       script-binding uosc/paste-to-open                            # open a path or url from the clipboard
#            script-binding uosc/show-in-directory                                               #! File > Show in folder
:            script-binding console/enable                                # command line         #! File > Command line
?            script-binding keys/toggle                                   # hotkeys              #! File > Hotkeys
F1           script-binding keys/toggle                                   # hotkeys
r            script-binding reload/reload_resume                          # reload, keep the position
Ctrl+r       script-binding reload/reload_resume                          # reload, keep the position
Shift+w      write-watch-later-config                                     # remember the position now
q            quit                                                         # quit, any quit resumes later
Q            set save-position-on-quit no; delete-watch-later-config; quit # quit, start over next time

## Video

ALT+s        script-message-to uosc show-submenu "Video"                  # video menu
f            cycle fullscreen                                             # fullscreen           #! Video > Fullscreen
#            cycle deband                                                                        #! Video > Deband
Ctrl+d       script-binding autodeint/autodeint                           # deinterlace          #! Video > Deinterlace
e            screenshot                                                   # screenshot           #! Video > Screenshot
E            screenshot video                                             # screenshot, no subs  #! Video > Screenshot without subtitles
c            script-binding videoclip-menu-open                           # cut a clip           #! Video > Cut a clip
i            script-binding stats/display-stats                           # stats
I            script-binding stats/display-stats-toggle                    # stats, keep shown    #! Video > Stats
#            script-binding uosc/video                                                           #! Video > Tracks

## Audio

ALT+z        script-message-to uosc show-submenu "Audio"                  # audio menu
9            add volume -5; script-binding uosc/flash-volume              # quieter / louder
0            add volume 5;  script-binding uosc/flash-volume              # quieter / louder
WHEEL_DOWN   add volume -5; script-binding uosc/flash-volume              # quieter / louder
WHEEL_UP     add volume 5;  script-binding uosc/flash-volume              # quieter / louder
m            cycle mute;    script-binding uosc/flash-volume              # mute                 #! Audio > Mute
A            script-binding uosc/audio                                    # pick a track         #! Audio > Tracks
#            script-binding uosc/audio-device                                                    #! Audio > Output

## Subtitles

ALT+x        script-message-to uosc show-submenu "Subtitles"              # subtitles menu
v            cycle sub-visibility                                         # show / hide          #! Subtitles > Show / hide
/            script-binding subtitle_lines/list_subtitles                 # search the lines     #! Subtitles > Search the lines
Ctrl+f       script-binding subtitle_lines/list_subtitles                 # search the lines
Y            script-binding uosc/subtitles                                # pick a track         #! Subtitles > Tracks
y            script-binding uosc/load-subtitles                           # load from a file     #! Subtitles > Load from a file
ALT+b        script-binding uosc/download-subtitles                       # download             #! Subtitles > Download
n            script-binding autosubsync-menu                              # sync to the audio    #! Subtitles > Sync to the audio
ALT+k        add sub-scale -0.05                                          # smaller / bigger     #! Subtitles > Smaller
ALT+j        add sub-scale +0.05                                          # smaller / bigger     #! Subtitles > Bigger
z            add sub-delay -0.1                                           # 0.1 s earlier / later #! Subtitles > 0.1 s earlier
Z            add sub-delay 0.1                                            # 0.1 s earlier / later #! Subtitles > 0.1 s later


# hypridle: the idle timer, swayidle's replacement. after 10 minutes the
# session locks (hyprlock) and the screens go off; any input brings them back
# to the lock screen. hypridle also serves org.freedesktop.ScreenSaver on the
# session bus, which is the api browsers and mpv actually use, and it reads
# logind's idle inhibitors, so a playing video holds the timer by itself: no
# helper script and no sway-audio-idle-inhibit (that one takes a logind
# inhibitor, which swayidle ignores but hypridle honours)
general {
    # one instance only, hypridle runs it on the timeout and on logind's lock
    lock_cmd = pidof hyprlock || hyprlock
    # a locked screen before suspend, logind's Lock signal comes back here
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session && hyprctl dispatch "hl.dsp.dpms({ action = 'disable' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

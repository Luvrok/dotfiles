# hyprlock: the lock screen. gruvbox like the menus (quickshell/Theme.qml):
# the orange clock, the dim date, the password line with an orange border.
# the background is the screen as it was, blurred and darkened: hyprlock
# draws stills, not the live video (that was quickshell/Screensaver.qml)
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    contrast = 1.0
    vibrancy = 0.12
}

# the clock: 64pt bold orange, as Lock.qml had it. hyprlock has no font weight
# option, the bold comes from pango markup in the label
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = rgb(d65d0e)
    font_family = JetBrainsMonoNL Nerd Font
    font_size = 64
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B" | tr "[:upper:]" "[:lower:]"
    color = rgba(ebdbb273)
    font_family = JetBrainsMonoNL Nerd Font
    font_size = 14
    position = 0, 32
    halign = center
    valign = center
}

# the password line, like the menus' text line: dark fill, 1px orange border,
# square corners
input-field {
    monitor =
    size = 360, 52
    outline_thickness = 1
    rounding = 0
    inner_color = rgb(171717)
    outer_color = rgb(d65d0e)
    font_color = rgb(ebdbb2)
    font_family = JetBrainsMonoNL Nerd Font
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text =
    fail_text = wrong password
    position = 0, -55
    halign = center
    valign = center
}

# proxychains-ng for the run menu's alt+enter: an app through xray, its
# mixed inbound on 10808 (hosts/barnard/xray.nix, home/local/sh/shell-proxy
# uses it too). names resolve on the other side
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000
localnet 127.0.0.0/255.0.0.0
localnet ::1/128

[ProxyList]
socks5 127.0.0.1 10808
